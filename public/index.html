<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subtitle Desk · 字幕校对台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎬 Subtitle Desk <span class="subtitle">小团队字幕校对台</span></h1>
  </header>

  <main id="app"></main>

  <!-- 编辑片段弹窗 -->
  <div id="editorModal" class="modal hidden">
    <div class="modal-card">
      <h3 id="editorTitle">编辑片段</h3>
      <p class="meta">片段 #<span id="editorId"></span> ｜ 所见修订号 <b id="editorRevision"></b>
        <span id="editorReviewNote" class="warn hidden">（已审；保存修改将撤销审校状态）</span></p>
      <div class="form-row">
        <label>起点 (ms)
          <input id="editStart" type="number" min="0" step="1" />
        </label>
        <button type="button" class="btn small" id="editStartNow">取播放位置</button>
        <label>终点 (ms)
          <input id="editEnd" type="number" min="1" step="1" />
        </label>
        <button type="button" class="btn small" id="editEndNow">取播放位置</button>
      </div>
      <label class="block">字幕文本
        <textarea id="editText" rows="4"></textarea>
      </label>
      <p id="editorError" class="error"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="editorCancel">取消（保留原稿）</button>
        <button type="button" class="btn primary" id="editorSave">保存修改</button>
      </div>
    </div>
  </div>

  <!-- 冲突弹窗 -->
  <div id="conflictModal" class="modal hidden">
    <div class="modal-card">
      <h3>⚠️ 修订冲突</h3>
      <p id="conflictMessage" class="error"></p>
      <p class="meta">他人修改后的当前内容（修订号 <b id="conflictRevision"></b>）：</p>
      <div class="conflict-current">
        <p><span class="tag" id="conflictTime"></span>
           <span class="tag ok hidden" id="conflictReviewed">已审</span>
           <span class="tag warn hidden" id="conflictNotReviewed">待审</span></p>
        <pre id="conflictText"></pre>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="conflictDiscard">放弃我的修改，使用当前内容</button>
        <button type="button" class="btn primary" id="conflictReload">基于当前内容重新编辑</button>
      </div>
    </div>
  </div>

  <!-- SRT 导入弹窗 -->
  <div id="importModal" class="modal hidden">
    <div class="modal-card" style="width:720px">
      <h3>📥 导入 SRT 字幕</h3>
      <p class="meta">选择本地 SRT 文件（UTF-8，可含 BOM；序号可不连续，支持多行文本）。先预览解析结果与冲突，
        确认后才会写入；导入的片段均为「待审」，已发布版本不受影响。</p>
      <div class="form-row">
        <label>SRT 文件
          <input type="file" id="importFile" accept=".srt,text/plain" />
        </label>
        <label>写入方式
          <select id="importMode">
            <option value="append">追加到现有草稿</option>
            <option value="replace">替换整个草稿</option>
          </select>
        </label>
        <button type="button" class="btn" id="importPreviewBtn">预览解析</button>
      </div>
      <p id="importError" class="error"></p>
      <div id="importPreview"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="importCancel">取消</button>
        <button type="button" class="btn primary" id="importConfirmBtn" disabled>确认导入</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
